openapi: 3.0.3
info:
  title: DocNoS Notarization and Verification API
  version: '0.8.0-starterkit'
  description: |
    REST interface reconstructed from the DocNoS Python StarterKit (v0.8.0,
    dated 2026-03-28). Only operations, request examples, and authentication
    directly visible in that client are documented. Response body structures,
    exact status codes, and server-side validation rules are not specified by
    the source and need confirmation against official API documentation.
  x-source: https://github.com/austriapro/blockchain/blob/master/DocNoS-API-StarterKit/python/docnos_python.py
servers:
  - url: https://blockchains.web-lab.at/docnos3-api
    description: Server used by the Python StarterKit
tags:
  - name: Notarization
  - name: Verification
security:
  - ApiToken: []
paths:
  /create/:
    post:
      tags: [Notarization]
      operationId: createNotarization
      summary: Create a document notarization
      description: |
        Submits cryptographic document hashes for notarization. The sample
        client calculates SHA-256 and SHA-512 locally; document contents are
        not sent. The optional ID, notarizeIfNew flag, and remarks are shown
        in the sample request. Their server-side constraints are unconfirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotarizationRequest'
            example:
              id: 12345678-5f7c-4eb2-9344-b35943815e07
              hashes:
                sha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                sha512: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
              notarizeIfNew: true
              remarks: sent from starterKit (Python) 0.8.0
      responses:
        '200':
          description: Response received; precise success status and response fields are not documented by the sample client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnspecifiedJsonResponse'
        default:
          description: Other HTTP status; error response structure is not specified by the sample client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnspecifiedJsonResponse'
  /verify/:
    get:
      tags: [Verification]
      operationId: verifyNotarization
      summary: Look up or verify a notarization
      description: |
        Specify one search parameter per request: `hash`, `id`, `txid`, or
        `blockHash`. The sample uses `hash=sha256:<digest>` and also shows
        `id=id:<UUID>`. It demonstrates transaction ID and block hash searches.
        OpenAPI 3.0 cannot express the exactly-one-of-these-query-parameters
        requirement at the operation level; clients should enforce it.
      parameters:
        - name: hash
          in: query
          required: false
          description: 'Algorithm-prefixed digest, e.g. sha256:<64 hexadecimal characters>.'
          schema:
            type: string
          example: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        - name: id
          in: query
          required: false
          description: 'Document ID prefixed with id:, as shown in the client comments.'
          schema:
            type: string
          example: 'id:12345678-5f7c-4eb2-9344-b35943815e07'
        - name: txid
          in: query
          required: false
          description: Blockchain transaction ID.
          schema:
            type: string
          example: '8877873041300b8ce01b0429523764e26b34422e9cfa7df532fd464a7ce89b03'
        - name: blockHash
          in: query
          required: false
          description: Blockchain block hash (noted in the sample as new in v1.6.x).
          schema:
            type: string
          example: '00a72a6c434c46a334c0101698c6124c13b01675f2ade6b1281d00dc1827457b'
      responses:
        '200':
          description: JSON verification result; shape and exact success status are unspecified in the sample client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnspecifiedJsonResponse'
        default:
          description: Other HTTP status; response structure unspecified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnspecifiedJsonResponse'
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-ApiToken
      description: Supply your own API token; the StarterKit includes a replaceable test token.
  schemas:
    CreateNotarizationRequest:
      type: object
      description: Fields observed in the Python sample; server-side requiredness beyond the body itself is not established.
      properties:
        id:
          type: string
          format: uuid
          description: Optional document identifier according to the sample comment.
        hashes:
          $ref: '#/components/schemas/DocumentHashes'
        notarizeIfNew:
          type: boolean
          description: Flag shown in the sample; exact server behavior is not documented there.
        remarks:
          type: string
          description: Free-text remark shown in the sample.
    DocumentHashes:
      type: object
      description: Client-side hashes of the original content. Other algorithms are not documented in the referenced sample.
      properties:
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: SHA-256 in hexadecimal.
        sha512:
          type: string
          pattern: '^[a-fA-F0-9]{128}$'
          description: SHA-512 in hexadecimal.
    UnspecifiedJsonResponse:
      description: JSON response shape was not included in the referenced Python code.
