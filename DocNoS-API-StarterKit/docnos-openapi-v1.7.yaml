# DocNoS REST API OpenAPI 3.0.3 — based on v1.7.0e (2026-06-06)
openapi: 3.0.3
info:
  title: DocNoS Notarization and Verification API
  version: 1.7.0e
  description: OpenAPI 3.0.3 definition based on DocNoS REST API v1.7.0e (DRAFT, 6 June 2026), including the
    embedded Python StarterKit v0.8.0 example. Describes documented operations, response structures, status
    codes and notarizeIfNew behavior. No live API testing was performed. POST verification parameter transport
    and response details when notarizeIfNew finds an existing notarization are not fully specified by the document.
  x-source: https://github.com/austriapro/blockchain/blob/master/DocNoS-API-StarterKit/python/docnos_python.py
  x-documentation:
    title: Document-Notarisation “DocNoS” – API
    version: 1.7.0e
    date: '2026-06-06'
    status: DRAFT
    source: DocNoS_REST-API_v17_20260606_english.pdf
servers:
- url: https://blockchains.web-lab.at/docnos3-api
  description: Test system documented in DocNoS REST API v1.7.0e (pp. 5, 7)
tags:
- name: Notarization
- name: Verification
security:
- ApiToken: []
paths:
  /create/:
    post:
      tags:
      - Notarization
      operationId: createNotarization
      summary: Create a document notarization
      description: Publishes at least a SHA-256 hash to the configured blockchain stream. Optional v4 UUID
        id (generated by server when omitted), remarks and notarizeIfNew. If notarizeIfNew is true, the server
        first checks whether the hash already exists; if so, it does not notarize again and returns data for
        the youngest matching entry (DocNoS v1.7.0e, p.5). No document bytes are uploaded. The PDF sample uses
        the string 'true' for notarizeIfNew while the Python StarterKit sends a JSON boolean true; the schema
        follows the Python implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotarizationRequest'
            example:
              id: 12345678-5f7c-4eb2-9344-b35943815e07
              hashes:
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                sha512: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              notarizeIfNew: true
              remarks: sent from starterKit (Python) 0.8.0
      responses:
        '200':
          description: Success. When a new notarization is created the response includes the transaction ID,
            timestamp, document ID, service, and infos as shown in the PDF. With notarizeIfNew=true and an
            existing SHA-256 hash, the API instead returns data of the youngest existing entry; exact response
            shape for this branch is not illustrated in the PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSuccessResponse'
              example:
                success: OK, data published in transaction 11fecdbffb6f9d626c921a34d5b537ea4528e33cd074e2bf561a467c0fb52860
                timeStamp: '2023-07-20T09:01:05+02:00'
                id: 12345678-5f7c-4eb2-9344-b35943815ed5
                txid: 11fecdbffb6f9d626c921a34d5b537ea4528e33cd074e2bf561a467c0fb52860
                service: DocNoS receiver/create v1.6.2
                infos: client:pyDemo v:1 stream:docnos-test-1 chain:mc2b1 rpc:127.0.0.1:7222
        '400':
          $ref: '#/components/responses/CreateBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/ServiceConfigError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /verify/:
    get:
      tags: &id001
      - Verification
      operationId: verifyNotarization
      summary: Look up or verify a notarization
      description: Search for notarization by at least one of hash, id, txid or blockHash. Multiple transactions
        may be returned for a repeated hash or client-generated ID; the oldest transaction is most relevant.
        GET and POST are supported in the PDF; the PDF demonstrates query-string parameters but does not explicitly
        define a POST body. An unconfirmed transaction may have zero confirmations and null blockHash/blockTime,
        or an epoch-like blockTime (1970-01-01T01:00:00+01:00). An absent match is an HTTP 404, not a successful
        empty array. The specification requires one of the four search parameters; it does not establish behavior
        if several are supplied together.
      parameters: &id002
      - name: hash
        in: query
        required: false
        description: Algorithm-prefixed digest in the form type:value (e.g. sha256:<64 hex digits>).
        schema:
          type: string
        example: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - name: id
        in: query
        required: false
        description: 'Document UUID prefixed with id: (e.g., id:<UUID>).'
        schema:
          type: string
        example: id:12345678-5f7c-4eb2-9344-b35943815e07
      - name: txid
        in: query
        required: false
        description: Blockchain transaction ID.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        example: 8877873041300b8ce01b0429523764e26b34422e9cfa7df532fd464a7ce89b03
      - name: blockHash
        in: query
        required: false
        description: 64-digit hexadecimal blockchain block hash. The example printed beside blockHash in PDF
          p.7 resembles a UUID, but the StarterKit p.13 gives a full 64-digit hash; the latter is used here.
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        example: 00a72a6c434c46a334c0101698c6124c13b01675f2ade6b1281d00dc1827457b
      responses: &id003
        '200':
          description: One or more matching blockchain transactions. Response structure varies by blockchain
            deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySuccessResponse'
              examples:
                privateSector:
                  summary: Private Sector Blockchain
                  value:
                    success: 'hash found: sha256:8daf3a72c2bea121e7f8477141bfad7787192a2e0f82680cbf83f55a070fbdbf'
                    data:
                    - publisher: 13VXwdarLRtV5fyP8qdWEFXebe6Ay45pgdY4Bb
                      txid: 11fecdbffb6f9d626c921a34d5b537ea4528e33cd074e2bf561a467c0fb52860
                      blockHash: 0001241892b2ac07a48e8c0587f0ba9c85dd130ed956a1b5596e0a65d1361169
                      blockTime: '2023-07-20T09:01:09+02:00'
                      confirmations: 21
                      data:
                        timeStamp: '2023-07-20T09:01:05+02:00'
                        client: pyDemo
                        version: DocNoS-v1.1
                        data:
                          id: 12345678-5f7c-4eb2-9344-b35943815ed5
                          hashes:
                            sha256: 8daf3a72c2bea121e7f8477141bfad7787192a2e0f82680cbf83f55a070fbdbf
                          remarks: sent from pyDemo 0.5
                    service: DocNoS receiver/verify v1.6.2
                    infos: client:pyDemo v:1 stream:docnos-test-1 chain:mc2b1 rpc:127.0.0.1:7222
                publicService:
                  summary: Austrian Public Service Blockchain
                  value:
                    success: hash found
                    service: DocNoS receiver/verify v1.40
                    data:
                    - txid: 295a9c67904b0be0edb8a8474c3e0fb0dfaef5ed7d13f6f9a593284765092914
                      blockHash: 00df1aaee406648f3e3ba94ae488bd376320a8e1a2c11e80438e8f49ec05e674
                      blockTime: '2020-12-08T17:34:15+01:00'
                      confirmations: 3
                      data:
                        metadataInternal:
                          app: unknown
                          time: '1607445243000'
                          storageType: JSON
                        metadataExternal:
                          additionalMetadata: null
                          user: pyDemo
                          dataType: Blockstempel-v2
                          tags:
                          - Blockstempel-v2
                          - id:1c123b9d-5f7c-4eb2-9344-b35943815ed5
                        data:
                          id: 1c123b9d-5f7c-4eb2-9344-b35943815ed5
                          time: '2020-12-08T17:34:03+01:00'
                          hashes:
                            sha256: 2bf928c9b7877fa508487a70d387bee8b66399f3f024bf757bbd52b4ea2c3aa2
                          optional:
                            size: null
        '400':
          $ref: '#/components/responses/VerifyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServiceConfigError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: *id001
      summary: Verify a notarization using POST
      description: Search for notarization by at least one of hash, id, txid or blockHash. Multiple transactions
        may be returned for a repeated hash or client-generated ID; the oldest transaction is most relevant.
        GET and POST are supported in the PDF; the PDF demonstrates query-string parameters but does not explicitly
        define a POST body. An unconfirmed transaction may have zero confirmations and null blockHash/blockTime,
        or an epoch-like blockTime (1970-01-01T01:00:00+01:00). An absent match is an HTTP 404, not a successful
        empty array. The specification requires one of the four search parameters; it does not establish behavior
        if several are supplied together. For POST, query parameters are included as a modeling choice; PDF
        p.7 confirms POST support but does not say whether POST query, form, or JSON body parameter transport
        is accepted.
      parameters: *id002
      responses: *id003
      operationId: verifyNotarizationPost
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-ApiToken
      description: Supply your own API token; the StarterKit includes a replaceable test token.
  schemas:
    CreateNotarizationRequest:
      type: object
      required:
      - hashes
      additionalProperties: true
      description: JSON request for create documented in DocNoS REST API v1.7.0e p.5 and Python StarterKit
        pp.11–12.
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          description: Optional UUID version 4; server generates an ID if omitted (StarterKit guidance).
        hashes:
          $ref: '#/components/schemas/DocumentHashes'
        remarks:
          type: string
          description: Optional remark.
        notarizeIfNew:
          type: boolean
          description: Optional. If true, check whether the supplied hash already exists before notarizing.
            If present, do not publish a second notarization; return the youngest matching entry. The PDF sample
            shows "true" as a string, but its Python StarterKit uses JSON boolean true. Behavior when false/absent
            is regular creation; no default is declared.
          example: true
    DocumentHashes:
      type: object
      required:
      - sha256
      properties:
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        sha512:
          type: string
          pattern: ^[a-fA-F0-9]{128}$
        sha3/512:
          type: string
          pattern: ^[a-fA-F0-9]{128}$
          description: SHA3-512; algorithm key uses slash (shown escaped as sha3\/512 in some JSON serializers).
      additionalProperties:
        type: string
      description: SHA-256 is mandatory. Other algorithms may be accepted subject to server configuration.
    CreateSuccessResponse:
      type: object
      required:
      - success
      - timeStamp
      - id
      - txid
      - service
      - infos
      properties:
        success:
          type: string
        timeStamp:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        txid:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        service:
          type: string
        infos:
          type: string
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        service:
          type: string
        infos:
          type: string
      description: JSON error envelope shown on DocNoS REST API v1.7.0e pp.6 and 10.
    VerifySuccessResponse:
      type: object
      required:
      - success
      - data
      - service
      properties:
        success:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/VerifiedTransaction'
        service:
          type: string
        infos:
          type: string
          description: Shown in private-sector example; not present in public-service example.
    VerifiedTransaction:
      type: object
      required:
      - txid
      - blockHash
      - blockTime
      - confirmations
      - data
      properties:
        publisher:
          type: string
          description: Present in private-sector example; absent from public-service example.
        txid:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        blockHash:
          type: string
          nullable: true
          pattern: ^[a-fA-F0-9]{64}$
        blockTime:
          type: string
          format: date-time
          nullable: true
          description: May be null or an epoch-like timestamp for unconfirmed transactions.
        confirmations:
          type: integer
          minimum: 0
        data:
          oneOf:
          - $ref: '#/components/schemas/PrivateSectorTransactionData'
          - $ref: '#/components/schemas/PublicServiceTransactionData'
    PrivateSectorTransactionData:
      type: object
      required:
      - timeStamp
      - client
      - version
      - data
      properties:
        timeStamp:
          type: string
          format: date-time
        client:
          type: string
        version:
          type: string
        data:
          $ref: '#/components/schemas/NotarizedDocument'
    NotarizedDocument:
      type: object
      required:
      - hashes
      properties:
        id:
          type: string
          format: uuid
        hashes:
          $ref: '#/components/schemas/DocumentHashes'
        remarks:
          type: string
      additionalProperties: true
    PublicServiceTransactionData:
      type: object
      required:
      - metadataInternal
      - metadataExternal
      - data
      properties:
        metadataInternal:
          $ref: '#/components/schemas/PublicMetadataInternal'
        metadataExternal:
          $ref: '#/components/schemas/PublicMetadataExternal'
        data:
          $ref: '#/components/schemas/PublicDocumentData'
    PublicMetadataInternal:
      type: object
      properties:
        app:
          type: string
        time:
          type: string
          description: Milliseconds since epoch, encoded as a string in the example.
        storageType:
          type: string
      additionalProperties: true
    PublicMetadataExternal:
      type: object
      properties:
        additionalMetadata:
          nullable: true
          description: Example value is null; structure not specified.
        user:
          type: string
        dataType:
          type: string
        tags:
          type: array
          items:
            type: string
      additionalProperties: true
    PublicDocumentData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        time:
          type: string
          format: date-time
        hashes:
          $ref: '#/components/schemas/DocumentHashes'
        optional:
          type: object
          properties:
            size:
              type: integer
              nullable: true
          additionalProperties: true
      additionalProperties: true
  responses:
    CreateBadRequest:
      description: Malformed or missing JSON, missing hashes, invalid hash algorithm/value or UUID. (PDF v1.7.0e
        p.6) Error text in the example is illustrative; document specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 400: Bad request'
            service: DocNoS receiver/create v1.6.2
            infos: n/a
    VerifyBadRequest:
      description: No supported search parameter, or invalid txid/blockHash format. (PDF v1.7.0e p.10) Error
        text in the example is illustrative; document specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 400: Bad request'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    Unauthorized:
      description: Missing or invalid X-ApiToken. (PDF v1.7.0e pp.6,10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 401: Unauthorized (API-Token not known/valid)'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    Forbidden:
      description: Client disabled or IP address not permitted. (PDF v1.7.0e pp.6,10) Error text in the example
        is illustrative; document specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 403: Forbidden'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    MethodNotAllowed:
      description: Create only accepts POST. (PDF v1.7.0e p.6) Error text in the example is illustrative; document
        specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 405: Method not allowed'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    NotFound:
      description: No blockchain transaction matching the query. (PDF v1.7.0e p.10)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'hash not found: sha256:7d8028dc7273a4da78320629dd14fccc998bc9ff5a25f4152187c1404c3d9847'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    ServiceConfigError:
      description: Service configuration error. (PDF v1.7.0e pp.6,10) Error text in the example is illustrative;
        document specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 500: Service configuration error'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
    ServiceUnavailable:
      description: Blockchain chain or stream temporarily deactivated. (PDF v1.7.0e pp.6,10) Error text in
        the example is illustrative; document specifies only the status/reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'Error 503: Service unavailable'
            service: DocNoS receiver/verify v1.6.2
            infos: n/a
